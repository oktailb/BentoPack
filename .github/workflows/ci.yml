name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: Linux (Ubuntu GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System & Qt6 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgit2-dev \
            libgl1-mesa-dev \
            libgl-dev \
            libegl1-mesa-dev \
            libxkbcommon-x11-0 \
            libpulse-dev \
            libasound2-dev \
            qt6-image-formats-plugins

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Package Godot Addon
        run: |
          cmake --build build --target package_godot_addon
          ls -lah build/dist/godot-bentopack-addon-*.zip

      - name: Upload Godot Addon Package
        uses: actions/upload-artifact@v4
        with:
          name: godot-bentopack-addon
          path: build/dist/godot-bentopack-addon-*.zip

  windows:
    name: Windows (MinGW 64-bit)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 & MinGW Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-libgit2

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --parallel

      - name: Run Tests
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose

  macos:
    name: macOS (Apple Silicon Clang)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install qt@6 libgit2 ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix libgit2)"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose

  haiku:
    name: Haiku OS (x86_64 VM)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and Test on Haiku VM
        uses: vmactions/haiku-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: false
          mem: 4096
          cpu: 2
          prepare: |
            pkgman refresh
            echo 1 | pkgman install -y cmd:cmake cmd:gcc cmd:ninja cmd:git qt6_base_devel qt6_tools_devel devel:libgit2 || \
            echo 1 | pkgman install -y cmd:cmake cmd:gcc cmd:ninja cmd:git qt6_base_devel qt6_tools_devel
          run: |
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j 2
            export QT_QPA_PLATFORM=offscreen
            ctest --test-dir build --output-on-failure --verbose --timeout 60
