name: Release BentoPack

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. 0.10.0 or v0.10.0). Leave empty for auto-detection.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux Deliverables (DEB, RPM, AppImage, Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            rpm \
            file \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgit2-dev \
            libgl1-mesa-dev \
            libgl-dev \
            libegl1-mesa-dev \
            libxkbcommon-x11-0 \
            libpulse-dev \
            libasound2-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Build CPack Packages (DEB, RPM, TGZ)
        run: |
          cd build
          cpack -G "DEB;RPM;TGZ"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          DESTDIR=AppDir cmake --install build
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp BentoPack/res/linux/bentopack.desktop AppDir/usr/share/applications/
          cp BentoPack/res/icons/bentopack.png AppDir/usr/share/icons/hicolor/256x256/apps/
          
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          
          export QMAKE=/usr/lib/qt6/bin/qmake
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file BentoPack/res/linux/bentopack.desktop \
            --icon-file BentoPack/res/icons/bentopack.png \
            --plugin qt \
            --output appimage || true
          
          if ls BentoPack*.AppImage 1> /dev/null 2>&1; then
            mv BentoPack*.AppImage build/
          elif ls BentoPack*.AppImage 1> /dev/null 2>&1; then
            mv BentoPack*.AppImage build/
          fi

      - name: Package Godot Addon
        run: |
          cmake --build build --target package_godot_addon
          ls -lah build/dist/godot-bentopack-addon-*.zip

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage
            build/dist/godot-bentopack-addon-*.zip

  release-windows:
    name: Build Windows Deliverables (ZIP Portable, NSIS Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 & MinGW Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-libgit2
            mingw-w64-x86_64-nsis
            p7zip

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --parallel

      - name: Run Tests
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Deploy Windows Runtime Dependencies
        shell: msys2 {0}
        run: |
          set +e
          set +o pipefail

          # 1. Locate and copy required Qt6 plugins
          QT_PLUGINS_DIR="/mingw64/share/qt6/plugins"
          if [ ! -d "$QT_PLUGINS_DIR" ]; then
            QT_PLUGINS_DIR="/mingw64/lib/qt6/plugins"
          fi
          if [ ! -d "$QT_PLUGINS_DIR" ]; then
            QT_PLUGINS_DIR="$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || true)"
          fi
          echo "Using Qt plugins directory: $QT_PLUGINS_DIR"

          mkdir -p build/bin/platforms build/bin/imageformats build/bin/styles build/bin/iconengines

          if [ -d "$QT_PLUGINS_DIR" ]; then
            cp -u "$QT_PLUGINS_DIR"/platforms/*.dll build/bin/platforms/ 2>/dev/null || true
            cp -u "$QT_PLUGINS_DIR"/imageformats/*.dll build/bin/imageformats/ 2>/dev/null || true
            cp -u "$QT_PLUGINS_DIR"/styles/*.dll build/bin/styles/ 2>/dev/null || true
            cp -u "$QT_PLUGINS_DIR"/iconengines/*.dll build/bin/iconengines/ 2>/dev/null || true
          fi

          # Create qt.conf in build/bin so Qt finds plugins relative to the executable
          printf '[Paths]\nPrefix = .\nPlugins = .\n' > build/bin/qt.conf

          # 2. Directly copy core Qt6 and MinGW runtime libraries
          cp -u /mingw64/bin/Qt6Core*.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/Qt6Gui*.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/Qt6Widgets*.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/Qt6Network*.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/Qt6Concurrent*.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/libgit2*.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/libstdc++-6.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/libgcc_s_seh-1.dll build/bin/ 2>/dev/null || true
          cp -u /mingw64/bin/libwinpthread-1.dll build/bin/ 2>/dev/null || true

          # 3. Collect all recursive MSYS2 / MinGW runtime dependencies via ldd (3 passes for transitive deps)
          for pass in 1 2 3; do
            for bin in build/bin/*.exe build/bin/*.dll build/bin/*/*.dll; do
              if [ -f "$bin" ]; then
                for token in $(ldd "$bin" 2>/dev/null | grep -i 'mingw' || true); do
                  t="${token#(}"
                  t="${t%)}"
                  if [ ! -f "$t" ] && command -v cygpath >/dev/null 2>&1; then
                    t="$(cygpath -u "$t" 2>/dev/null || echo "$t")"
                  fi
                  if [ -f "$t" ]; then
                    cp -u "$t" build/bin/ 2>/dev/null || true
                  fi
                done
              fi
            done
          done

          set -e
          ls -lah build/bin/

      - name: Verify Standalone Execution (No MSYS2 in PATH)
        shell: cmd
        run: |
          set PATH=%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\Wbem;%CD%\build\bin
          set QT_QPA_PLATFORM=offscreen
          build\bin\bentopack-cli.exe --version
          build\bin\bentopack.exe --version

      - name: Build Standalone Windows Packages (ZIP Portable & NSIS Installer)
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cd build
          cpack -G "ZIP;NSIS"
          cp BentoPack-*.zip ../dist/
          cp BentoPack-*.exe ../dist/ || true
          ls -lah ../dist/

      - name: Upload Windows Packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  release-macos-arm64:
    name: Build macOS Apple Silicon Deliverables (DMG, App Bundle ZIP)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install qt@6 libgit2 ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix libgit2)"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Deploy Qt and Package DMG
        run: |
          mkdir -p dist
          APP_PATH="build/bin/bentopack.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/bin/BentoPack.app"
          fi
          /opt/homebrew/opt/qt@6/bin/macdeployqt "$APP_PATH"
          
          # Create DMG via CPack or hdiutil
          cd build
          cpack -G DragNDrop || true
          if ls *.dmg 1> /dev/null 2>&1; then
            cp *.dmg ../dist/
          else
            hdiutil create -volname "BentoPack" -srcfolder "../$APP_PATH" -ov -format UDZO ../dist/BentoPack-macOS-arm64.dmg
          fi
          cd ..
          
          # Also package ZIP of the .app
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/BentoPack-macOS-arm64.zip

      - name: Upload macOS Apple Silicon Packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-packages
          path: dist/*

  release-macos-x86_64:
    name: Build macOS Intel Deliverables (DMG, App Bundle ZIP, macOS 11+)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ninja

      - name: Install Qt 6.6.3 (Universal with macOS 11.0+ deployment target)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'clang_64'
          modules: 'qtimageformats'
          cache: true

      - name: Build static LibGit2 for x86_64 (macOS 11.0+)
        run: |
          git clone --depth 1 -b v1.8.4 https://github.com/libgit2/libgit2.git
          cmake -B libgit2_build -S libgit2 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/libgit2_install"
          cmake --build libgit2_build --target install

      - name: Configure CMake (x86_64, macOS 11.0 Target)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew" \
            -DLIBGIT2_ROOT="$PWD/libgit2_install"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests (under Rosetta 2)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          arch -x86_64 ctest --test-dir build --output-on-failure --verbose

      - name: Deploy Qt and Package DMG & ZIP
        run: |
          mkdir -p dist
          APP_PATH="build/bin/bentopack.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/bin/BentoPack.app"
          fi
          macdeployqt "$APP_PATH"
          
          # Create DMG
          hdiutil create -volname "BentoPack" -srcfolder "$APP_PATH" -ov -format UDZO dist/BentoPack-macOS-x86_64.dmg
          
          # Also package ZIP of the .app
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/BentoPack-macOS-x86_64.zip
          ls -lah dist/

      - name: Upload macOS Intel Packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-packages
          path: dist/*

  release-haiku:
    name: Build Haiku OS Deliverables (HPKG)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and Package inside Haiku VM
        uses: vmactions/haiku-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          mem: 4096
          cpu: 2
          prepare: |
            pkgman refresh
            echo 1 | pkgman install -y cmd:cmake cmd:gcc cmd:ninja cmd:git qt6_base_devel qt6_tools_devel devel:libgit2 || \
            echo 1 | pkgman install -y cmd:cmake cmd:gcc cmd:ninja cmd:git qt6_base_devel qt6_tools_devel
          run: |
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j 2
            export QT_QPA_PLATFORM=offscreen
            ctest --test-dir build --output-on-failure --verbose --timeout 60
            
            mkdir -p dist
            cmake --install build --prefix haiku_pkg
            PKG_VERSION=$(grep '^version' build/generated/haiku.PackageInfo | awk '{print $2}')
            package create -i build/generated/haiku.PackageInfo -C haiku_pkg dist/BentoPack-${PKG_VERSION}-x86_64.hpkg

      - name: Upload Haiku Package
        uses: actions/upload-artifact@v4
        with:
          name: haiku-packages
          path: dist/*.hpkg

  publish-release:
    name: Publish GitHub Release
    needs: [release-linux, release-windows, release-macos-arm64, release-macos-x86_64, release-haiku]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts for release
        run: |
          mkdir -p release_assets
          find artifacts/ -type f -exec cp {} release_assets/ \;
          ls -lah release_assets/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --exact-match 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "0.10.0")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: BentoPack ${{ steps.tag_info.outputs.tag }}
          body: |
            ## BentoPack ${{ steps.tag_info.outputs.tag }}

            Official release of **BentoPack**.
            
            - **License:** 100% Free and Open Source under the permissive **Apache License, Version 2.0**.
            - **Features:** Complete packing algorithms (MaxRects, tight polygon mesh, VRAM KTX2/Basis Universal compression), all format extractors (Godot, Unity, Unreal, GIF, JSON, SpriteSheet), and filters.
            - **Deliverables:** Self-contained, portable binaries for Windows (portable ZIP & NSIS setup), Linux (AppImage, DEB, RPM, TGZ), macOS (DMG), and Haiku (HPKG).
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

